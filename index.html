<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FinnB24 – Interactive 3D Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css" />
  <!-- Load Three.js with error handling -->
  <script async src="https://unpkg.com/es-module-shims/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/"
      }
    }
  </script>
  <!-- Use correct paths -->
  <script type="module" src="./main.js"></script>
</head>
<body>
  <div id="three-canvas"></div>
  <!-- Overlay UI -->
  <div id="overlay-home" class="overlay visible">
    <h1><span class="brand">FinnB24</span> Playground</h1>
    <p>
      Use <kbd>WASD</kbd> or <kbd>Arrow</kbd> keys to move.<br>
      Use your mouse to look around.<br>
      Click the screen to start.<br>
      <small>(Inspired by <a href="https://bruno-simon.com/" target="_blank">bruno-simon.com</a>)</small>
    </p>
    <button onclick="closeOverlay('home')">Start Walking</button>
  </div>
  <!-- Other overlays omitted for brevity -->
</body>
</html>
